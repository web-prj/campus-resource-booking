services:
  postgres:
    image: postgres:16-alpine
    container_name: web-backend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-web_backend}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-web_backend}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: web-backend-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      API_PREFIX: ${API_PREFIX:-api}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001}
      # Reach Postgres over the compose network, not localhost.
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-web_backend}
      DB_SYNCHRONIZE: 'false'
      DB_LOGGING: ${DB_LOGGING:-false}
      # Required: compose fails fast rather than booting with a shared default
      # secret that would make every deployment's tokens forgeable.
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET (min 32 chars, e.g. openssl rand -base64 48)}
      AUTH_TOKEN_EXPIRES_IN: ${AUTH_TOKEN_EXPIRES_IN:-1d}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-access_token}
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-lax}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_BCRYPT_ROUNDS: ${AUTH_BCRYPT_ROUNDS:-12}
      THROTTLE_TTL: ${THROTTLE_TTL:-60}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
      AUTH_THROTTLE_LIMIT: ${AUTH_THROTTLE_LIMIT:-10}
    ports:
      - '${PORT:-3000}:3000'
    # Apply pending migrations, then start the compiled server.
    command: >
      sh -c "node node_modules/typeorm/cli.js migration:run -d dist/database/data-source.js
      && node dist/main"

volumes:
  postgres_data:
