name: campus-resource-booking

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-web_backend}
    ports:
      - "${DB_HOST_PORT:-18322}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -c 'SELECT 1' >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      target: backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Local Compose runs compiled code over HTTP. For production, set
      # NODE_ENV=production and AUTH_COOKIE_SECURE=true behind HTTPS.
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 18320
      API_PREFIX: ${API_PREFIX:-api}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:18321}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-web_backend}
      DB_SYNCHRONIZE: "false"
      DB_LOGGING: ${DB_LOGGING:-false}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET (min 32 chars; use openssl rand -base64 48)}
      AUTH_TOKEN_EXPIRES_IN: ${AUTH_TOKEN_EXPIRES_IN:-1d}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-access_token}
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-lax}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_BCRYPT_ROUNDS: ${AUTH_BCRYPT_ROUNDS:-12}
      THROTTLE_TTL: ${THROTTLE_TTL:-60}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
      AUTH_THROTTLE_LIMIT: ${AUTH_THROTTLE_LIMIT:-10}
      # Optional: promotes this registered USTH account to administrator at
      # startup when no active administrator exists. Empty means unset.
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
    ports:
      - "${BACKEND_PORT:-18320}:18320"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:$${PORT}/$${API_PREFIX}/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: .
      target: frontend
      args:
        # Browser-visible URL; this value is embedded during `next build`.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:18320/api}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Server Components use the Compose network instead of browser localhost.
      INTERNAL_API_URL: http://backend:18320/${API_PREFIX:-api}
    ports:
      - "${FRONTEND_PORT:-18321}:18321"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:$${PORT}/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  default:
    ipam:
      config:
        # Explicit subnet avoids Docker daemon address-pool exhaustion on hosts
        # that run many Compose projects. Override with DOCKER_SUBNET if needed.
        - subnet: ${DOCKER_SUBNET:-10.203.250.0/24}

volumes:
  postgres_data:
