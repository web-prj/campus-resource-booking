version: 2
updates:
  - package-ecosystem: npm
    directory: /web-frontend
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    groups:
      frontend-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web-backend
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    groups:
      backend-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:45"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
